[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensepi"
version = "0.1.0"
description = "SensePi MPU"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6>=6.6",
  "numpy>=1.25",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "paramiko>=3.3",
  "PyYAML>=6.0",
  "psutil>=5.9",
  "pyqtgraph>=0.13",
  # Audio output for the Sonification tab. A base dependency, not an extra:
  # it is small and pure-Python-installable everywhere, and as an extra it was
  # simply never installed, so every fresh install ran the tab in silent mode.
  "sounddevice>=0.4",
]

[project.optional-dependencies]
# Kept so `pip install -e ".[sonification]"` still works; sounddevice moved
# into the base dependencies above.
sonification = []
model-updating = [
  # Same rule as requirements.txt (see the comment there). Use Python 3.12: on
  # Windows the current OpenSees build links python312.dll, so it fails to
  # import on 3.13+; on Windows + 3.11 the last working build (3.5.1.12) is
  # selected instead.
  'openseespy>=3.7; sys_platform != "win32" or python_version != "3.11"',
  'openseespy==3.5.1.3; sys_platform == "win32" and python_version == "3.11"',
  'openseespywin==3.5.1.12; sys_platform == "win32" and python_version == "3.11"',
  "opsvis>=1.0",
]

[project.scripts]
sensepi-gui = "sensepi.gui.application:main"
sensepi-sonify = "sensepi.sonification.cli:main"
opensees-calibrate = "opensees_model_updating.cli.main:main"
opensees-gui = "opensees_model_updating.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["archive*"]

[tool.setuptools.package-data]
"sensepi.sonification.chorus" = ["data/*.json", "data/*.npz", "data/*.md"]
