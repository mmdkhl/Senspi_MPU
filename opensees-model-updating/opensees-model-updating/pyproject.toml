[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensees-model-updating"
version = "1.0.0"
description = "Automated 3D-frame modal calibration and updating with OpenSeesPy"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "OpenSees Frame Calibrator Contributors"}]
keywords = ["opensees", "structural", "modal", "calibration", "finite-element"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "openseespy>=3.4.0",
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.3",
    "opsvis>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "black>=23.0",
    "ruff>=0.4",
]

[project.scripts]
opensees-calibrate = "opensees_model_updating.cli.main:main"
opensees-gui       = "opensees_model_updating.__main__:main"

[tool.setuptools]
packages = [
    "opensees_model_updating",
    "opensees_model_updating.analysis",
    "opensees_model_updating.calibration",
    "opensees_model_updating.cli",
    "opensees_model_updating.domain",
    "opensees_model_updating.examples",
    "opensees_model_updating.gui",
    "opensees_model_updating.gui.controllers",
    "opensees_model_updating.gui.tabs",
    "opensees_model_updating.gui.widgets",
    "opensees_model_updating.infrastructure",
    "opensees_model_updating.infrastructure.config",
    "opensees_model_updating.infrastructure.filesystem",
    "opensees_model_updating.infrastructure.opensees",
    "opensees_model_updating.io",
    "opensees_model_updating.model",
    "opensees_model_updating.reporting",
    "opensees_model_updating.tests",
    "opensees_model_updating.tests.fixtures",
    "opensees_model_updating.tests.integration",
    "opensees_model_updating.tests.unit",
    "opensees_model_updating.tests.unit.test_domain",
    "opensees_model_updating.tests.unit.test_utils",
    "opensees_model_updating.utils",
    "opensees_model_updating.visualization",
    "opensees_model_updating.workflows",
]

[tool.setuptools.package-dir]
"opensees_model_updating" = "src"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = "test_*.py"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
